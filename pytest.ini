[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --alluredir=allure-results --clean-alluredir
markers =
    positive: positive test scenarios
    negative: negative test scenarios
    calendars: tests for Calendars page
    modals: tests for Modals page
    ads: tests for Ads page
    form_fields: tests for Form Fields page
